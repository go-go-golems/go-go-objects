pre-commit:
  commands:
    lint:
      glob: '*.go'
      run: make lint
    logcopter-check:
      glob: '*.go'
      run: make logcopter-check
    test:
      glob: '*.go'
      run: make test
  parallel: true

pre-push:
  commands:
    release:
      run: make goreleaser
    lint:
      run: make lint
    logcopter-check:
      run: make logcopter-check
    docsctl-check:
      run: make docsctl-check
    test:
      run: make test
  parallel: true
